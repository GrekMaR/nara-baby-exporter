[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-baby-exporter"
version = "0.1.0"
description = "Parse and normalize Nara Baby app CSV exports into a portable, app-agnostic schema."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GrekMaR" }]

[project.scripts]
nara-export = "nara_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
